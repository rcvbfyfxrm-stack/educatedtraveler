name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  # A push made by a workflow using GITHUB_TOKEN does NOT raise a `push` event —
  # GitHub suppresses it to stop workflows triggering themselves. Without this,
  # the nightly Atlas rebuild and the concierge publish would commit, go green,
  # and never reach the live site: a craft would open in the repo and keep saying
  # "Not open yet" to visitors until a human happened to push something.
  workflow_run:
    workflows: ["Rebuild the Atlas", "Publish approved concierge Atlas pages"]
    types: [completed]
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  # Newest wins. With `false`, a deployment that wedges in `deployment_queued`
  # takes every run behind it down with it — that happened on 2026-08-06: three
  # consecutive deploys sat queued for 10-17 minutes and timed out, and the site
  # served an hour-old build while every push looked like it had worked.
  cancel-in-progress: true

jobs:
  deploy:
    # A workflow_run fires even when the upstream job failed; don't ship on a red build.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The nightly jobs finish green whether or not they committed anything, and
      # workflow_run can't tell the difference. Deploying regardless burns Pages
      # build quota on identical content and is what queued the backlog above.
      # If this commit is already the one deployed, stop here.
      - name: Skip if this commit is already live
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          live=""
          # newest first; stop at the first one that actually reached "success"
          gh api "repos/${{ github.repository }}/deployments?environment=github-pages&per_page=15" \
            --jq '.[] | "\(.id) \(.sha)"' > /tmp/deps.txt 2>/dev/null || true
          while read -r id sha; do
            [ -n "${id:-}" ] || continue
            state=$(gh api "repos/${{ github.repository }}/deployments/$id/statuses" \
                      --jq '.[0].state' 2>/dev/null || echo "")
            if [ "$state" = "success" ]; then live="$sha"; break; fi
          done < /tmp/deps.txt
          echo "last successful deployment: ${live:-none}"
          echo "this commit:                $GITHUB_SHA"
          if [ -n "$live" ] && [ "$live" = "$GITHUB_SHA" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Already live — nothing to deploy."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Pages
        if: steps.gate.outputs.skip != 'true'
        uses: actions/configure-pages@v4

      - name: Upload artifact
        if: steps.gate.outputs.skip != 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: './website'

      - name: Deploy to GitHub Pages
        if: steps.gate.outputs.skip != 'true'
        id: deployment
        uses: actions/deploy-pages@v4
