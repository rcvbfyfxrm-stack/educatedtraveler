name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  # A push made by a workflow using GITHUB_TOKEN does NOT raise a `push` event —
  # GitHub suppresses it to stop workflows triggering themselves. Without this,
  # the nightly Atlas rebuild and the concierge publish would commit, go green,
  # and never reach the live site: a craft would open in the repo and keep saying
  # "Not open yet" to visitors until a human happened to push something.
  workflow_run:
    workflows: ["Rebuild the Atlas", "Publish approved concierge Atlas pages"]
    types: [completed]
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    # A workflow_run fires even when the upstream job failed; don't ship on a red build.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './website'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
