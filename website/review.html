<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Sign your review — EDUCATEDTRAVELER</title>
    <meta name="description" content="A personal link: review the schools you cooked at, under your own name.">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#0d0b09">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png">
    <link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..500&family=Inter:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script defer data-domain="educatedtraveler.app" src="https://plausible.io/js/script.js"></script>
    <style>
        /* Warm-Dark Editorial: the same tokens as /you and /portrait */
        :root{ --ink:#0d0b09; --ink2:#14110d; --paper:#f3ede2; --muted:rgba(243,237,226,.58);
               --faint:rgba(243,237,226,.34); --sea:#7fa8a5; --ember:#d28a52; --line:rgba(243,237,226,.10); }
        *{ box-sizing:border-box; margin:0; padding:0; -webkit-font-smoothing:antialiased; }
        html,body{ height:100%; }
        body{ font-family:'Inter',system-ui,-apple-system,sans-serif; background:var(--ink); color:var(--paper); line-height:1.5; overflow-x:hidden; }
        a{ color:var(--sea); text-decoration:none; }
        .mono{ font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.16em; text-transform:uppercase; }
        .serif{ font-family:'Fraunces',Georgia,serif; font-weight:300; }

        /* the steps ARE the navigation: tap any of them to go back to an answer */
        .steps{ position:fixed; top:0; left:0; right:0; z-index:9; display:flex; gap:6px; padding:10px 14px 18px;
                background:linear-gradient(180deg, rgba(13,11,9,.92) 0%, rgba(13,11,9,.6) 60%, rgba(13,11,9,0)); }
        .steps.off{ display:none; }
        .steps button{ flex:1; min-width:0; background:none; border:0; padding:4px 0; cursor:pointer; color:rgba(243,237,226,.72); text-align:left; text-shadow:0 1px 6px rgba(0,0,0,.7); }
        .steps i{ display:block; height:3px; border-radius:2px; background:rgba(243,237,226,.3); transition:background .3s; }
        .steps span{ display:block; margin-top:7px; font-family:'IBM Plex Mono',monospace; font-size:9.5px; letter-spacing:.1em;
                     text-transform:uppercase; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; transition:color .3s; }
        .steps button.past i{ background:var(--sea); }
        .steps button.now i{ background:linear-gradient(90deg,var(--sea),var(--ember)); }
        .steps button.now span{ color:var(--paper); }
        .steps button:hover span{ color:var(--paper); }
        .why{ margin-top:20px; padding:14px 16px; border:1px solid var(--line); border-radius:14px; background:rgba(243,237,226,.03); }
        .why p{ font-size:14.5px; line-height:1.55; margin-top:6px; }
        .why .sig{ font-family:'Fraunces',Georgia,serif; font-style:italic; color:var(--ember); margin-top:6px; display:block; }
        .edit{ background:none; border:0; color:var(--sea); font:inherit; font-size:13px; cursor:pointer; padding:0; margin-left:6px; }
        .brand{ display:inline-block; font-family:'Fraunces',Georgia,serif; letter-spacing:.16em; font-size:12px; color:var(--paper); opacity:.75; margin-bottom:18px; }
        .brand b{ font-weight:300; color:var(--sea); }

        .screen{ display:none; flex-direction:column; min-height:100vh; }
        .screen.on{ display:flex; animation:in .42s cubic-bezier(.2,.7,.2,1) backwards; }
        .screen.on.back-in{ animation-name:in-back; }
        @keyframes in{ from{ opacity:0; transform:translateX(18px); } to{ opacity:1; transform:none; } }
        @keyframes in-back{ from{ opacity:0; transform:translateX(-18px); } to{ opacity:1; transform:none; } }

        .photo{ position:relative; height:46vh; min-height:260px; max-height:520px; overflow:hidden; flex:0 0 auto; }
        .photo img{ width:100%; height:100%; object-fit:cover; display:block; }
        .photo::after{ content:''; position:absolute; inset:0; background:linear-gradient(180deg, rgba(13,11,9,.15) 0%, transparent 35%, rgba(13,11,9,.92) 100%); }
        .photo .over{ position:absolute; left:0; right:0; bottom:0; z-index:2; padding:0 20px 18px; max-width:640px; margin:0 auto; }
        .photo .over .mono{ color:var(--sea); }
        .photo h2{ font-family:'Fraunces',Georgia,serif; font-weight:300; font-size:clamp(30px,8vw,46px); line-height:1.04; margin-top:6px; }
        .photo .sub{ color:rgba(243,237,226,.78); font-size:14px; margin-top:4px; }
        .duo{ display:grid; grid-template-columns:1fr 1fr; gap:3px; height:100%; }
        .duo img{ height:100%; }

        .body{ flex:1; width:100%; max-width:640px; margin:0 auto; padding:22px 20px calc(28px + env(safe-area-inset-bottom)); display:flex; flex-direction:column; }
        .lede{ color:var(--muted); font-size:16px; }
        h1{ font-family:'Fraunces',Georgia,serif; font-weight:300; font-size:clamp(34px,9vw,52px); line-height:1.02; }
        h1 em{ font-style:italic; color:var(--ember); }

        textarea{ width:100%; min-height:132px; background:transparent; border:0; border-bottom:1px solid rgba(243,237,226,.2);
                  color:var(--paper); font-family:'Fraunces',Georgia,serif; font-weight:300; font-size:21px; line-height:1.45;
                  padding:6px 0 12px; resize:none; overflow:hidden; transition:border-color .25s; }
        textarea::placeholder{ color:var(--faint); font-style:italic; }
        textarea:focus{ outline:none; border-color:var(--sea); }
        .meter{ height:2px; background:var(--line); margin-top:-1px; }
        .meter i{ display:block; height:100%; width:0; background:var(--sea); transition:width .25s; }
        .hint{ display:flex; justify-content:space-between; gap:12px; font-size:12.5px; color:var(--faint); margin-top:8px; }

        .label{ font-size:13px; color:var(--muted); margin:22px 0 10px; }
        .chips{ display:flex; flex-wrap:wrap; gap:8px; }
        .chip{ border:1px solid rgba(243,237,226,.18); background:rgba(243,237,226,.03); color:var(--paper);
               border-radius:99px; padding:9px 14px; font:inherit; font-size:14px; cursor:pointer; transition:border-color .2s, background .2s; }
        .chip:hover{ border-color:rgba(127,168,165,.6); }
        .chip[aria-pressed=true]{ border-color:var(--sea); background:rgba(127,168,165,.2); }
        input[type=month]{ color-scheme:dark; margin-top:10px; }

        .field{ position:relative; margin-top:16px; }
        .field input{ width:100%; background:rgba(243,237,226,.04); border:1px solid rgba(243,237,226,.16); border-radius:14px;
                      color:var(--paper); font:inherit; font-size:16px; padding:22px 14px 9px; transition:border-color .2s; }
        .field input:focus{ outline:none; border-color:var(--sea); }
        .field label{ position:absolute; left:15px; top:8px; font-size:11.5px; color:var(--faint); pointer-events:none; }
        .field.at input{ padding-left:30px; }
        .field.at::before{ content:'@'; position:absolute; left:15px; bottom:10px; color:var(--faint); font-size:16px; }

        .reads{ margin-top:18px; padding:14px 16px; border-left:2px solid var(--ember); background:rgba(210,138,82,.06); border-radius:0 12px 12px 0; }
        .reads q{ display:block; font-family:'Fraunces',Georgia,serif; font-style:italic; font-weight:300; font-size:16.5px; line-height:1.45; quotes:'\201C' '\201D'; }
        .reads span{ display:block; color:var(--muted); font-size:13px; margin-top:6px; }
        .reads + .reads{ margin-top:10px; }

        .tick{ display:flex; gap:12px; align-items:flex-start; margin-top:16px; font-size:15px; cursor:pointer; }
        .tick input{ width:22px; height:22px; margin-top:1px; accent-color:var(--sea); flex:0 0 auto; }
        .tick small{ display:block; color:var(--muted); font-size:13px; margin-top:2px; }

        .foot{ margin-top:auto; padding-top:26px; }
        .go{ width:100%; border:0; border-radius:99px; padding:17px 22px; font:inherit; font-size:16px; font-weight:500; color:var(--ink);
             background:linear-gradient(110deg,var(--sea),var(--ember)); cursor:pointer; transition:transform .2s, opacity .3s; }
        .go:hover{ transform:translateY(-1px); }
        .go[disabled]{ opacity:.35; cursor:default; transform:none; }
        .skip{ display:block; margin:14px auto 0; background:none; border:0; color:var(--faint); font:inherit; font-size:13.5px; cursor:pointer; }
        .skip:hover{ color:var(--muted); }
        .err{ color:var(--ember); font-size:14px; margin-top:12px; min-height:1px; }
        .fine{ color:var(--faint); font-size:12.5px; margin-top:14px; line-height:1.6; text-align:center; }

        .done-list{ list-style:none; margin-top:22px; border-top:1px solid var(--line); }
        .done-list li{ padding:14px 0; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; gap:12px; align-items:baseline; }
        .ghost{ display:block; text-align:center; margin-top:12px; border:1px solid var(--sea); border-radius:99px; padding:15px 20px; color:var(--paper); }

        @media (min-width:900px){
            .screen.split{ flex-direction:row; }
            .screen.split .photo{ height:100vh; max-height:none; width:50%; position:sticky; top:0; }
            .screen.split .body{ width:50%; max-width:560px; padding:110px 48px 48px; margin:0; }
        }
        @media (prefers-reduced-motion:reduce){ *{ transition:none !important; animation:none !important; } }
    </style>
</head>
<body>
<nav class="steps" id="steps" aria-label="Steps"></nav>
<main id="app"></main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/supabase-config.js"></script>
<script>
(function () {
    // One link per person. Their name and the schools they cooked at are written here by
    // hand; everything they SAY is theirs, typed by them on this page.
    // ⛔ Never prefill what they saw: a review we wrote in their name is a made-up review.
    var INVITES = {
        alix: {
            first: 'Alix', name: 'Alix Verrips', trade: 'Yacht chef', craft: 'oaxacan-and-mexican-cuisine',
            schools: [
                { school: 'Casa Crespo Cooking Classes', label: 'Casa Crespo', teacher: 'Óscar',
                  dest: 'oaxacan-and-mexican-cuisine--oaxaca', where: 'Oaxaca', page: 'Oaxaca',
                  img: '/images/atlas/oaxacan-and-mexican-cuisine--oaxaca/casa-crespo-01-oscar-teaching.jpg', pos: '50% 18%',
                  ask: 'What did Óscar teach you that you still use?' },
                { school: 'México Lindo Cooking (Chef Alejandra Kauachi)', label: 'México Lindo', teacher: 'Ale and Rosalía',
                  dest: 'oaxacan-and-mexican-cuisine--merida-yucatan', where: 'Puerto Morelos · Valladolid · Yaxunah', page: 'Mérida–Yucatán',
                  img: '/images/atlas/oaxacan-and-mexican-cuisine--merida-yucatan/mexico-lindo-07-rosalia-the-mill.jpg', pos: '50% 35%',
                  ask: 'What happened in that kitchen that a chef should know?' }
            ]
        }
    };
    var TRADES = ['Yacht chef', 'Yacht crew', 'Chef or cook', 'Something else'];
    var MIN = 40, MAX = 1200;

    function $(id) { return document.getElementById(id); }
    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
    var app = $('app');

    var key = (new URLSearchParams(location.search).get('for') || '').toLowerCase();
    var inv = INVITES[key];
    if (!inv) {
        app.innerHTML = '<section class="screen on"><div class="body" style="padding-top:110px"><div class="mono" style="color:var(--sea)">A personal link</div>' +
            '<h1 style="margin:12px 0 14px">This link is made for one person.</h1><p class="lede">To say something about a school you went to, open its page on ' +
            '<a href="/atlas">the Atlas</a> and use <em>Been here? Write a comment</em> on its card.</p></div></section>';
        return;
    }

    // ── state, kept in this browser only so a closed tab loses nothing ──
    var SAVE = 'et-review-' + key;
    var st = { name: inv.name, ig: '', trade: inv.trade, other: '', email: '', said: {}, when: {}, skip: {} };
    try { Object.assign(st, JSON.parse(localStorage.getItem(SAVE) || '{}')); } catch (e) {}
    function keep() { try { localStorage.setItem(SAVE, JSON.stringify(st)); } catch (e) {} }

    function ig() { return st.ig.trim().replace(/^@+/, '').replace(/^https?:\/\/(www\.)?instagram\.com\//i, '').replace(/[\/?#\s].*$/, ''); }
    function trade() { return st.trade === 'Something else' ? st.other.trim() : st.trade; }
    function byname() { var n = st.name.trim(), h = ig(), f = h ? n + ' · @' + h : n; return f.length <= 40 ? f : n; }
    function monthLabel(v) { if (!v) return ''; var d = new Date(v + '-01T12:00:00'); return isNaN(d) ? '' : d.toLocaleDateString('en-GB', { month: 'long', year: 'numeric' }); }
    function months() {   // the last four months as chips; anything older goes in "Earlier"
        var out = [], d = new Date(); d.setDate(1);
        for (var i = 0; i < 4; i++) { out.push(d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0')); d.setMonth(d.getMonth() - 1); }
        return out;
    }

    // ── screens: intro, one per school, you, done ──
    var N = inv.schools.length, at = 0;
    function screens() {
        var h = [];
        h.push('<section class="screen split" data-s="0">' +
            '<div class="photo"><div class="duo">' + inv.schools.slice(0, 2).map(function (s) {
                return '<img src="' + esc(s.img) + '" alt="" style="object-fit:cover;object-position:' + esc(s.pos) + '">'; }).join('') + '</div></div>' +
            '<div class="body"><a class="brand" href="/">EDUCATED<b>TRAVELER</b></a><div class="mono" style="color:var(--sea)">For ' + esc(inv.first) + '</div>' +
            '<h1 style="margin:10px 0 14px">' + (N === 2 ? 'Two kitchens.<br><em>Two minutes.</em>' : 'Your kitchens.<br><em>Two minutes.</em>') + '</h1>' +
            '<p class="lede">You cooked there. Say what you saw, in your own words, and it goes on each school’s card under your name.</p>' +
            '<div class="why"><div class="mono" style="color:var(--sea)">Why I’m asking</div>' +
            '<p>Before I build anything with a teacher, I want chefs who have actually cooked with them to vouch for them first. You’d be the first to do that for ' + esc(inv.schools.map(function (s) { return s.teacher.split(' and ')[0]; }).join(' and ')) + ', so what you write really counts for what I build next.</p>' +
            '<span class="sig">Arnaud</span></div>' +
            '<div class="foot"><button class="go" type="button" data-next>Start</button>' +
            '<p class="fine">I read every one before it goes up.</p></div></div></section>');
        inv.schools.forEach(function (s, i) {
            h.push('<section class="screen split" data-s="' + (i + 1) + '">' +
                '<div class="photo"><img src="' + esc(s.img) + '" alt="" style="object-position:' + esc(s.pos) + '">' +
                '<div class="over"><div class="mono">' + (i + 1) + ' of ' + N + ' · ' + esc(s.where) + '</div>' +
                '<h2>' + esc(s.label) + '</h2><div class="sub">with ' + esc(s.teacher) + '</div></div></div>' +
                '<div class="body"><textarea id="w' + i + '" maxlength="' + MAX + '" rows="3" placeholder="' + esc(s.ask) + '"></textarea>' +
                '<div class="meter"><i id="mt' + i + '"></i></div><div class="hint"><span id="h' + i + '">A few lines is plenty.</span><span id="n' + i + '"></span></div>' +
                '<div class="label">When were you there?</div><div class="chips" id="mo' + i + '">' +
                months().map(function (m) { return '<button type="button" class="chip" data-m="' + m + '" aria-pressed="false">' +
                    esc(new Date(m + '-01T12:00:00').toLocaleDateString('en-GB', { month: 'short', year: 'numeric' })) + '</button>'; }).join('') +
                '<button type="button" class="chip" data-m="earlier" aria-pressed="false">Earlier</button></div>' +
                '<input type="month" id="me' + i + '" style="display:none" max="' + months()[0] + '">' +
                '<div class="foot"><button class="go" type="button" data-next id="g' + i + '">' + (i + 1 < N ? 'Next kitchen' : 'Last step') + '</button>' +
                '<button class="skip" type="button" data-skip="' + i + '">I’d rather not review this one</button></div></div></section>');
        });
        h.push('<section class="screen" data-s="' + (N + 1) + '"><div class="body" style="padding-top:84px">' +
            '<div class="mono" style="color:var(--sea)">Last step</div><h1 style="margin:10px 0 6px;font-size:clamp(30px,8vw,42px)">Sign it.</h1>' +
            '<div id="reads"></div>' +
            '<div class="field"><label for="f-name">Your name</label><input id="f-name" maxlength="40" autocomplete="name"></div>' +
            '<div class="field at"><label for="f-ig">Instagram, shown with your name (optional)</label><input id="f-ig" maxlength="30" autocapitalize="off" autocomplete="off" spellcheck="false"></div>' +
            '<div class="label">What you do</div><div class="chips" id="tr">' + TRADES.map(function (t) {
                return '<button type="button" class="chip" aria-pressed="false">' + esc(t) + '</button>'; }).join('') + '</div>' +
            '<div class="field" id="f-other-w" style="display:none"><label for="f-other">In your own words</label><input id="f-other" maxlength="60"></div>' +
            '<div class="field"><label for="f-email">Email, never shown</label><input id="f-email" type="email" inputmode="email" autocomplete="email"></div>' +
            '<label class="tick"><input type="checkbox" id="f-pub"><span>Put these on the pages, under my name<small>I read each one myself first.</small></span></label>' +
            '<label class="tick"><input type="checkbox" id="f-circle"><span>Sign up to hear what I’m building next<small>A short note from me now and then. Leave any time.</small></span></label>' +
            '<div class="foot"><button class="go" type="button" id="send">Sign my reviews</button><div class="err" id="err" role="alert"></div>' +
            '<p class="fine">Nobody paid to be on these pages, and your email stays with me.</p></div></div></section>');
        h.push('<section class="screen" data-s="' + (N + 2) + '"><div class="body" style="padding-top:96px">' +
            '<div class="mono" style="color:var(--sea)">Signed</div><h1 style="margin:10px 0 12px">Thank you, <em>' + esc(inv.first) + '</em>.</h1>' +
            '<p class="lede">I’ll read them myself, then they go on the cards with your name. I’ll tell you when they’re up.</p>' +
            '<ul class="done-list" id="done"></ul>' +
            '<div class="foot"><a class="ghost" id="share" href="#">Send it to a chef who should see it</a></div></div></section>');
        app.innerHTML = h.join('');
    }
    screens();

    function go(n) {
        var cur = app.querySelector('.screen.on');
        if (cur) cur.classList.remove('on', 'back-in');
        var was = at; at = n;
        var nx = app.querySelector('[data-s="' + n + '"]');
        nx.classList.toggle('back-in', n < was); nx.classList.add('on');
        paintSteps();
        window.scrollTo(0, 0);
        if (n >= 1 && n <= N) { var t = $('w' + (n - 1)); setTimeout(function () { t.focus({ preventScroll: true }); }, 380); }
        if (n === N + 1) paintReads();
    }
    // one step per screen except the last; every step can be tapped, back or forward
    var LABELS = ['Why'].concat(inv.schools.map(function (s) { return s.label; }), ['Sign']);
    $('steps').innerHTML = LABELS.map(function (l, i) {
        return '<button type="button" data-go="' + i + '"><i></i><span>' + esc(l) + '</span></button>'; }).join('');
    function paintSteps() {
        $('steps').classList.toggle('off', at > N + 1);
        $('steps').querySelectorAll('button').forEach(function (b, i) {
            b.className = i < at ? 'past' : i === at ? 'now' : '';
            if (i === at) b.setAttribute('aria-current', 'step'); else b.removeAttribute('aria-current');
        });
    }

    // ── the kitchens ──
    function grow(t) { t.style.height = 'auto'; t.style.height = t.scrollHeight + 'px'; }
    function paintSchool(i) {
        var t = $('w' + i), n = t.value.trim().length;
        $('mt' + i).style.width = Math.min(100, n / MIN * 100) + '%';
        $('n' + i).textContent = n ? (n < MIN ? (MIN - n) + ' to go' : '✓') : '';
        $('h' + i).textContent = n >= MIN ? 'Good. Add more if you like.' : 'Who taught, what you made, what you would tell a chef.';
        $('g' + i).disabled = n < MIN;
    }
    inv.schools.forEach(function (s, i) {
        var t = $('w' + i);
        t.value = st.said[i] || '';
        t.addEventListener('input', function () { st.said[i] = t.value; st.skip[i] = false; keep(); grow(t); paintSchool(i); });
        var mo = $('mo' + i), me = $('me' + i);
        function pick(v) {
            st.when[i] = v; keep();
            var isChip = months().indexOf(v) >= 0;
            mo.querySelectorAll('.chip').forEach(function (c) {
                c.setAttribute('aria-pressed', c.dataset.m === v || (c.dataset.m === 'earlier' && v && !isChip)); });
            me.style.display = v && !isChip ? '' : 'none';
        }
        mo.addEventListener('click', function (e) {
            var c = e.target.closest('.chip'); if (!c) return;
            if (c.dataset.m === 'earlier') { pick(me.value || 'earlier'); me.style.display = ''; me.focus(); }
            else pick(c.dataset.m);
        });
        me.addEventListener('change', function () { if (me.value) pick(me.value); });
        if (st.when[i]) { if (months().indexOf(st.when[i]) < 0 && st.when[i] !== 'earlier') me.value = st.when[i]; pick(st.when[i]); }
        paintSchool(i);
        setTimeout(function () { grow(t); }, 0);
    });
    document.addEventListener('click', function (e) {
        var g = e.target.closest('[data-go]');
        if (g) { go(+g.dataset.go); return; }
        if (e.target.closest('[data-next]')) {
            if (at >= 1 && at <= N) st.skip[at - 1] = false, keep();
            go(at + 1);
        }
        var sk = e.target.closest('[data-skip]');
        if (sk) { st.skip[+sk.dataset.skip] = true; keep(); go(at + 1); }
    });

    // ── you ──
    function picked() {
        return inv.schools.map(function (s, i) {
            var w = (st.said[i] || '').trim(), m = st.when[i];
            return { s: s, what: w, when: m && m !== 'earlier' ? m : '' };
        }).filter(function (p, i) { return !st.skip[i] && p.what.length >= MIN; });
    }
    function paintReads() {
        var who = [byname(), trade()].filter(Boolean).join(', ');
        var ps = picked();
        var idx = function (s) { return inv.schools.indexOf(s) + 1; };
        $('reads').innerHTML = ps.length ? '<div class="label" style="margin-top:14px">How it reads</div>' + ps.map(function (p) {
            var m = monthLabel(p.when);
            return '<div class="reads"><q>' + esc(p.what) + '</q><span>— ' + esc(who) + (m ? ' · ' + esc(m) : '') + ' · on ' + esc(p.s.label) + ' <button type="button" class="edit" data-go="' + idx(p.s) + '">Edit</button></span></div>';
        }).join('') : '<p class="lede" style="margin-top:12px">Nothing to sign yet. Write about at least one kitchen first.</p>';
    }
    $('f-name').value = st.name; $('f-ig').value = st.ig; $('f-other').value = st.other; $('f-email').value = st.email;
    function paintTrade() {
        $('tr').querySelectorAll('.chip').forEach(function (c) { c.setAttribute('aria-pressed', c.textContent === st.trade); });
        $('f-other-w').style.display = st.trade === 'Something else' ? '' : 'none';
    }
    paintTrade();
    $('tr').addEventListener('click', function (e) {
        var c = e.target.closest('.chip'); if (!c) return;
        st.trade = c.textContent; keep(); paintTrade(); paintReads();
        if (st.trade === 'Something else') $('f-other').focus();
    });
    [['f-name', 'name'], ['f-ig', 'ig'], ['f-other', 'other'], ['f-email', 'email']].forEach(function (p) {
        $(p[0]).addEventListener('input', function () {
            if (p[1] === 'ig') this.value = this.value.replace(/^@+/, '');
            st[p[1]] = this.value; keep(); paintReads();
        });
    });

    function say(m) { $('err').innerHTML = m; }
    ['f-pub', 'f-circle'].forEach(function (id) { $(id).addEventListener('change', function () { say(''); }); });
    function hasAccount(email) {
        var sb = window.supabaseClient;
        if (!sb || !sb.functions) return Promise.resolve(false);
        var probe = sb.functions.invoke('check-email', { body: { email: email } })
            .then(function (r) { return !!(r && !r.error && r.data && r.data.member); }, function () { return false; });
        return Promise.race([probe, new Promise(function (ok) { setTimeout(function () { ok(false); }, 8000); })]);
    }

    $('send').addEventListener('click', async function () {
        say('');
        var ps = picked(), email = st.email.trim();
        if (!ps.length) return say('Write about at least one kitchen first.');
        if (st.name.trim().length < 2) { $('f-name').focus(); return say('Your name, as you want it on the page.'); }
        if (!trade()) { $('f-other').focus(); return say('What you do, in a few words.'); }
        if (!/.+@.+\..+/.test(email)) { $('f-email').focus(); return say('An email, so I can write back. It is never shown.'); }
        if (!$('f-pub').checked) return say('Tick the first box so your words can go on the pages.');
        var sb = window.supabaseClient;
        if (!sb) return say('Could not reach the site just now. Try again in a minute.');
        if (window.etCanWrite && !window.etCanWrite()) return say('Preview host: nothing was written. Add ?live=1 to write for real.');

        var btn = this; btn.disabled = true; btn.textContent = 'Signing…';
        var circle = $('f-circle').checked, ok = [], bad = [];
        for (var k = 0; k < ps.length; k++) {
            var p = ps[k];
            try {
                var r = await sb.from('vouches').insert({
                    user_id: null, craft: inv.craft, destination: p.s.dest, school: p.s.school,
                    what: p.what, state: 'stood in it', route: 'direct', trade: trade(),
                    visited_on: p.when ? p.when + '-01' : null, display_name: byname(), email: email,
                    consent_public: true, wants_circle: circle, status: 'pending' });
                if (r && r.error) throw r.error;
                ok.push(p.s);
            } catch (e) {
                var m = (e && (e.message || e.details)) || '';
                (/duplicate|unique/i.test(m) ? ok : bad).push(p.s);   // already signed is still signed
            }
        }
        if (circle && ok.length) {
            var interests = [{ kind: 'profile', name: st.name.trim(), region: null, profession: trade() },
                             { kind: 'discipline', discipline: inv.craft }];
            if (ig()) interests[0].instagram = '@' + ig();
            var payload = { email: email, source: 'review:' + key, interests: interests };
            if (await hasAccount(email)) payload.is_carrier = true;
            try { await sb.from('launch_waitlist').insert(payload); } catch (e) { /* the reviews are what mattered */ }
        }
        if (!ok.length) {
            btn.disabled = false; btn.textContent = 'Sign my reviews';
            return say('That did not save. Try again, or send your words to <a href="mailto:arnaudcallier@pm.me">arnaudcallier@pm.me</a>.');
        }
        try { localStorage.removeItem(SAVE); } catch (e) {}
        if (window.plausible) window.plausible('ReviewSigned', { props: { for: key, n: ok.length } });
        $('done').innerHTML = ok.map(function (s) {
            return '<li><span>' + esc(s.label) + '</span><a href="/atlas/' + esc(s.dest) + '">' + esc(s.page) + ' page →</a></li>';
        }).join('') + bad.map(function (s) {
            return '<li><span>' + esc(s.label) + '</span><span style="color:var(--ember)">did not save, send it to arnaudcallier@pm.me</span></li>';
        }).join('');
        $('share').href = 'https://wa.me/?text=' + encodeURIComponent('If you cook, this is a free map of where you can still learn a craft at the source: https://educatedtraveler.app/atlas/' + inv.craft);
        go(N + 2);
    });

    go(0);
})();
</script>
</body>
</html>
