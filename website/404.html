<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nothing here — EducatedTraveler</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..500&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{--ink:#0d0b09;--paper:#f3ede2;--sea:#7fa8a5;--line:rgba(243,237,226,.09)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--ink);color:var(--paper);font-family:'Inter',system-ui,sans-serif;font-weight:300;line-height:1.7;display:flex;min-height:100vh;align-items:center;justify-content:center;padding:32px}
.wrap{max-width:44ch}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--sea)}
h1{font-family:'Fraunces',Georgia,serif;font-weight:300;font-size:clamp(28px,6vw,42px);line-height:1.1;margin:14px 0 16px}
p{opacity:.78}
.cues{margin-top:26px;display:flex;gap:12px;flex-wrap:wrap}
a.btn{display:inline-block;padding:12px 22px;border-radius:99px;font-size:14px;font-weight:500;text-decoration:none;color:#14110d;background:linear-gradient(135deg,var(--sea),#d28a52 130%)}
a.ghost{display:inline-block;padding:12px 20px;border-radius:99px;font-size:14px;text-decoration:none;color:var(--paper);border:1px solid rgba(243,237,226,.2)}
</style>
</head>
<body>
<div class="wrap">
<div class="mono">404</div>
<h1>There's nothing at this address.</h1>
<p>Either it moved or it never existed — and I'd rather say so than pretend. The Atlas is the place to start: every craft I've mapped, and where it's still alive.</p>
<div class="cues"><a class="btn" href="/atlas/">Open the Atlas</a><a class="ghost" href="/">Home</a></div>
</div>
</body>
</html>
